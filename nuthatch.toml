[nest]
name = "arcaidia-nest"
chain = "arc-testnet"
chain_id = 5042002
# Probed with `nuthatch doctor --address` on 2026-09-11. arc.io: 20,000-block getLogs by hand,
# archive, but a per-second burst cap that 429s a cold start. drpc: 5,120 blocks, archive, batches
# of 10. arc.network: 20 blocks. Three hosts so the backfill can spread; keep --window under 5000.
rpc_urls = [
    "https://rpc.testnet.arc.io",
    "https://arc-testnet.drpc.org",
    "https://rpc.testnet.arc.network",
]
