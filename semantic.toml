[view.fills]
description = "The subgraph's Fill entity: one row per FastFilled with amounts as decimals; id is txHash-logIndex."

[view.settlements]
description = "The subgraph's Settlement entity from both receivers, with outcome LP_REIMBURSED or RECIPIENT_FALLBACK."

[view.intents]
description = "The subgraph's Intent entity with fast_status and canonical_status derived from fills and settlements on this chain."

[view.vault]
description = "The subgraph's Vault entity per vault address: liquid balance, outstanding exposure, fees, deposit and withdrawal totals, paused."

[view.protocol_state]
description = "The subgraph's ProtocolState singleton: intent counts, pending settlement value, oldest unsettled timestamp, total fees."

[view.pending_intents]
description = "The agent's PendingIntents query: intents with no fill on this chain, oldest first."
