[nest]
name = "v2-sepolia"
chain = "sepolia"
chain_id = 11155111
rpc_urls = ["https://ethereum-sepolia-rpc.publicnode.com"]
schema_version = 1
block_timestamps = true

# Arcaidia v2 (WP-27). Addresses are CREATE2-identical on both chains; the start block is the
# earliest of the three deployments, as the builder's own manifest uses.
[[contracts]]
alias = "intent_router"
address = "0x69946ffbbe5f250c7357b89e4072f9eafc1c3ee6"
start_block = 11688303
abi = "abis/intent_router.json"

[[contracts]]
alias = "vault_factory"
address = "0xd458d83c874296ec4a29c47655ae47302879b23a"
start_block = 11688303
abi = "abis/vault_factory.json"

[[contracts]]
alias = "settlement_receiver"
address = "0x8b93b54d6df61e9422d14c309f3c9ab950b920cd"
start_block = 11688303
abi = "abis/settlement_receiver.json"

# Every vault the factory creates, indexed from its own VaultCreated block. The template name is
# the table prefix, so these stay `liquidity_vault__*` exactly as the v1 readers expect.
# The four Configured events are not in the builder's table list but the policy and the caps can
# change after creation, so `vaults.current_fee_bps` would go stale without them.
[[templates]]
name = "liquidity_vault"
abi = "abis/liquidity_vault.json"
events = [
    "VaultInitialized",
    "FastFilled",
    "DeliveredViaSwap",
    "SwapFellBack",
    "Deposit",
    "Withdraw",
    "ReimbursementRecorded",
    "FeesAccrued",
    "PausedSet",
    "FeePolicyConfigured",
    "FillLimitsConfigured",
    "ReserveFloorConfigured",
]

[[factories]]
watch = "vault_factory"
event = "VaultCreated"
child_param = "vault"
template = "liquidity_vault"
start = 11688303
